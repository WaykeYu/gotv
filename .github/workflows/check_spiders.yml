name: Check Spiders & JS Health

on:
  schedule:
    # 每天 UTC 02:00（台灣時間 10:00）定期自動執行
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'py/**.py'
      - 'js/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 lxml pycryptodome urllib3 pyquery

      - name: Ensure NG Folders Exist
        run: |
          mkdir -p py/NG js/NG
          touch py/NG/.gitkeep js/NG/.gitkeep

      - name: Run Spider Checker & Build Configurations
        run: |
          python scripts/check_spiders.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A
          if git diff --staged --quiet; then
            echo "沒有任何檔案變動，無需提交。"
            exit 0
          fi

          git commit -m "chore(auto): 更新 box_py.json, fun_py.json 與隔離失效腳本 [skip ci]"

          # 採用重試與自動合併機制，杜絕 non-fast-forward 衝突
          for i in {1..3}; do
            echo "嘗試推送到遠端 (第 $i 次)..."
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push 成功！"
              exit 0
            fi
            sleep 2
          done

          echo "Push 失敗，請確認分支保護規則或寫入權限。"
          exit 1
