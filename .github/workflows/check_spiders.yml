name: Check Spiders & JS Health

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'py/**.py'
      - 'js/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 lxml pycryptodome urllib3

      - name: Ensure NG Folders Exist
        run: |
          mkdir -p py/NG js/NG
          touch py/NG/.gitkeep js/NG/.gitkeep

      - name: Run Spider Checker
        run: |
          python scripts/check_spiders.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有任何檔案變動，無需提交。"
          else
            git commit -m "chore(auto): 建立/隔離失效腳本至 NG 目錄 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
