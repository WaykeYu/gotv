name: Check Spiders & JS Health

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'py/**.py'
      - 'js/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 lxml pycryptodome urllib3

      - name: Run Spider Checker
        run: |
          python scripts/check_spiders.py

      - name: Commit & Push Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add SPIDER_STATUS.md
          if git diff --staged --quiet; then
            echo "報告無任何變動，跳過提交。"
          else
            git commit -m "chore(auto): 更新 py 及 js 影音網站有效性報告 [skip ci]"
            git push
          fi
