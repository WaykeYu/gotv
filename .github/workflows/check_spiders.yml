name: Check Spiders Health

on:
  schedule:
    # 每天 UTC 02:00（台灣時間上午 10:00）自動執行
    - cron: '0 2 * * *'
  workflow_dispatch: # 支援在 GitHub 頁面手動點擊執行
  push:
    paths:
      - 'py/**.py' # 當有新腳本變更或新增時觸發

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 lxml pycryptodome urllib3

      - name: Run Spider Checker
        run: |
          python scripts/check_spiders.py

      - name: Commit & Push Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add SPIDER_STATUS.md
          if git diff --staged --quiet; then
            echo "沒有狀態變更，無需提交。"
          else
            git commit -m "chore(auto): 更新影音網站有效性統計報告 [skip ci]"
            git push
          fi
