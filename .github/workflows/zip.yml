name: Update zip (Read-only / Artifacts)

permissions:
  contents: read
  actions: write # 用於清理舊的 Workflow 執行紀錄

on:
  schedule:
    - cron: '0 * * * *'  # 每小時運行一次
  workflow_dispatch:     # 允許手動觸發

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Delete old records
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Process Xiaosa resource
      run: |
        echo "Starting Xiaosa download..."
        
        mkdir -p output/js/xiaosa
        mkdir -p temp_xiaosa
        cd temp_xiaosa
        
        wget --tries=3 --timeout=30 https://github.com/PizazzGY/NewTVBox/raw/main/%E5%8D%95%E7%BA%BF%E8%B7%AF.zip -O xiaosa.zip
        unzip -q xiaosa.zip
        
        if [ -d "TVBoxOSC/tvbox" ]; then
          cp -rf TVBoxOSC/tvbox/* ../output/js/xiaosa/
          echo "Xiaosa files processed successfully."
        else
          echo "Error: Xiaosa source directory structure changed."
          ls -R
          exit 1
        fi
        
        cd ..
        rm -rf temp_xiaosa

    # 將結果保存為 Actions 產物供下載，不執行任何 git commit / push
    - name: Upload processed files as artifact
      uses: actions/upload-artifact@v4
      with:
        name: xiaosa-processed
        path: output/
        retention-days: 3
