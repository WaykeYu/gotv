name: Upstream Sync

permissions:
  contents: write
  actions: write
  pull-requests: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "上游仓库分支"
        required: true
        default: "main"
        type: string
      target_branch:
        description: "目标仓库分支"
        required: true
        default: "main"
        type: string

env:
  UPSTREAM_REPO: "cluntop/tvbox"
  UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}

jobs:
  sync_upstream:
    name: Sync Upstream (Hard Reset)
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Force Sync from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 添加上游远程仓库
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true

          # 2. 获取上游最新所有提交
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

          # 3. 强制重置当前分支到上游，丢弃一切本地冲突与修改
          git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}

          # 4. 强制推送到当前仓库的目标分支
          git push origin ${{ env.TARGET_BRANCH }} --force

      - name: Generate Summary
        if: always()
        run: |
          echo "### 🔄 同步报告 (Sync Report)" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **源仓库** | [${{ env.UPSTREAM_REPO }}](https://github.com/${{ env.UPSTREAM_REPO }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **状态** | ✅ 强制同步成功（已覆盖本地冲突） |" >> $GITHUB_STEP_SUMMARY

      - name: Delete Old Workflows
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
